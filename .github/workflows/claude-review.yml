name: Claude review

# Automated PR review. Same-repo PRs (this repo's own feat/ branches) get the ANTHROPIC_API_KEY
# secret; PRs from forks never do, so the job no-ops there instead of failing.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write  # post the review as a PR comment

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the action diffs against the base branch
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review the changes in this pull request. This is malloop, a malware-analysis
            pipeline; read AGENTS.md for the invariants that must never break. Focus on:
            - the safety invariants in AGENTS.md (no samples committed, no host execution,
              agent has no shell, sample-derived text stays <untrusted>, bounded/path-safe parsing,
              no real network in detonation, budgets enforced in code)
            - correctness bugs and missing edge cases
            - unbounded or path-unsafe parsing of attacker-controlled input
            Be concise: only flag real issues, and skip style nits ruff already covers.
